<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードとビューポートの設定（レスポンシブ対応） -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="M.Miyoshi ポートフォリオサイトへのお問い合わせ送信完了ページです。">
  <title>お問い合わせ完了 | M.Miyoshi Portfolio</title>

  <!-- Google Fonts: 日本語明朝体（Noto Serif JP）、筆記体（Great Vibes）、サンセリフ（Plus Jakarta Sans / Cormorant Garamond） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- スタイルシートの読み込み（キャッシュバスティング付き） -->
  <link rel="stylesheet" href="style.css?v=20260906s">
</head>
<body>

  <!-- =================================================== -->
  <!-- ヘッダー -->
  <!-- =================================================== -->
  <header class="site-header" id="site-header">
    <div class="header-container">
      <a href="index.html" class="header-logo">
        <span class="logo-script">M</span><span class="logo-text">.Miyoshi  Portfolio Site</span>
      </a>
    </div>
  </header>

  <main>
    <!-- =================================================== -->
    <!-- サンクスセクション（ダークエディタ世界観のサンクスページ） -->
    <!-- =================================================== -->
    <section class="thanks-section">
      <!-- 最背面：プロフェッショナルなダークグリッド背景レイヤー -->
      <div class="hero-bg-layer" style="background-image: url('assets/images/hero_dark_grid.jpg?v=20260906i');"></div>
      
      <!-- 背景オーバーレイ -->
      <div class="hero-overlay"></div>

      <!-- 中央：サンクスカード（ダークグラスモーフィズム） -->
      <div class="thanks-card">
        <!-- 発光チェックアイコンバッジ -->
        <div class="thanks-icon-wrap">
          <div class="thanks-icon-halo"></div>
          <div class="thanks-icon-circle">
            <i class="fa-solid fa-check"></i>
          </div>
        </div>

        <p class="thanks-subtitle">MESSAGE RECEIVED</p>
        <h1 class="thanks-title">お問い合わせ<br class="sp-br">ありがとうございました！</h1>

        <div class="thanks-badge-time">
          <i class="fa-regular fa-clock"></i>
          <span>原則24時間以内にご返信いたします</span>
        </div>

        <div class="thanks-message">
          <p class="thanks-line">送信いただいたメッセージは<br class="sp-br">正常に受け付けられました。</p>
          <p class="thanks-line">内容を確認の上、ご入力いただいた<br class="sp-br">メールアドレス宛に<br class="sp-br">折り返しご連絡差し上げます。</p>
          <p class="thanks-line">今しばらくお待ちくださいますよう<br class="sp-br">お願い申し上げます。</p>
        </div>

        <!-- 「トップページに戻る」ボタン -->
        <a href="index.html" class="btn-thanks-home" id="btn-thanks-home">
          <i class="fa-solid fa-arrow-left"></i>
          <span>トップページに戻る</span>
        </a>
      </div>
    </section>
  </main>

  <!-- =================================================== -->
  <!-- フッター -->
  <!-- =================================================== -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-logo">
        <span class="logo-script">M</span><span class="logo-text">.Miyoshi</span>
      </div>
      <p class="footer-copy">© 2026 M.Miyoshi. All Rights Reserved. Built with Passion & AI-Driven Craftsmanship.</p>
    </div>
  </footer>

</body>
</html>
